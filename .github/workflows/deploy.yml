name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-east5
  APP_DIR: /opt/leadgen
  DOCKERHUB_REPOSITORY: ashujha301/leadgen

jobs:
  deploy:
    if: >
      vars.DEPLOY_ENABLED == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve commit SHA
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Set image tags
        id: images
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          echo "web_image=ashujha301/leadgen:web-${SHA}" >> "$GITHUB_OUTPUT"
          echo "worker_image=ashujha301/leadgen:worker-${SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.web_image }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.worker_image }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy over IAP SSH
        id: remote-deploy
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          INSTANCE_NAME: ${{ vars.GCP_INSTANCE_NAME }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          IMAGE_TAG: ${{ steps.images.outputs.image_tag }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker_image }}
        run: |
          set -euo pipefail
          ZONE="${GCP_ZONE:-us-east5-b}"

          gcloud compute ssh "${INSTANCE_NAME}" \
            --project "${PROJECT_ID}" \
            --zone "${ZONE}" \
            --tunnel-through-iap \
            --quiet \
            --command "set -euo pipefail
              APP_DIR='${APP_DIR}'
              APP_CHECKOUT=\"\${APP_DIR}/app\"
              SHA='${IMAGE_TAG}'
              WEB_IMAGE='${WEB_IMAGE}'
              WORKER_IMAGE='${WORKER_IMAGE}'
              PROJECT_ID='${PROJECT_ID}'

              if [[ ! -d \"\${APP_CHECKOUT}/.git\" ]]; then
                echo \"[deploy] Missing public git checkout at \${APP_CHECKOUT}\" >&2
                exit 1
              fi

              # Repo is owned by root; OS Login deploy user needs an explicit safe.directory.
              git config --global --add safe.directory \"\${APP_CHECKOUT}\"

              cd \"\${APP_CHECKOUT}\"

              if [[ -n \"\$(git status --porcelain)\" ]]; then
                echo \"[deploy] Refusing to update dirty checkout at \${APP_CHECKOUT}\" >&2
                git status --porcelain >&2
                exit 1
              fi

              git fetch --prune origin
              git checkout --detach \"\${SHA}\"

              sudo env \
                APP_DIR=\"\${APP_DIR}\" \
                GCP_PROJECT_ID=\"\${PROJECT_ID}\" \
                IMAGE_TAG=\"\${SHA}\" \
                WEB_IMAGE=\"\${WEB_IMAGE}\" \
                WORKER_IMAGE=\"\${WORKER_IMAGE}\" \
                \"\${APP_CHECKOUT}/infra/scripts/deploy.sh\""

      - name: Roll back on failure
        if: failure() && steps.remote-deploy.outcome == 'failure'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          INSTANCE_NAME: ${{ vars.GCP_INSTANCE_NAME }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          IMAGE_TAG: ${{ steps.images.outputs.image_tag }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker_image }}
        run: |
          set -euo pipefail
          ZONE="${GCP_ZONE:-us-east5-b}"

          gcloud compute ssh "${INSTANCE_NAME}" \
            --project "${PROJECT_ID}" \
            --zone "${ZONE}" \
            --tunnel-through-iap \
            --quiet \
            --command "set -euo pipefail
              APP_DIR='${APP_DIR}'
              sudo env \
                APP_DIR=\"\${APP_DIR}\" \
                GCP_PROJECT_ID='${PROJECT_ID}' \
                IMAGE_TAG='${IMAGE_TAG}' \
                WEB_IMAGE='${WEB_IMAGE}' \
                WORKER_IMAGE='${WORKER_IMAGE}' \
                \"\${APP_DIR}/app/infra/scripts/rollback.sh\"" || true
