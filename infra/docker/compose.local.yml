services:
  postgres:
    image: postgres:16-alpine
    container_name: leadgen-postgres
    environment:
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: leadgen
      POSTGRES_DB: leadgen
    ports:
      - "5432:5432"
    volumes:
      - leadgen_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadgen -d leadgen"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: leadgen-web
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://leadgen:leadgen@postgres:5432/leadgen?sslmode=disable
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: leadgen-worker
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://leadgen:leadgen@postgres:5432/leadgen?sslmode=disable
      PLAYWRIGHT_HEADLESS: "true"
      WORKER_CONCURRENCY: "1"
    security_opt:
      - seccomp=${SECCOMP_PATH:-./seccomp.json}
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  leadgen_pg_data:
