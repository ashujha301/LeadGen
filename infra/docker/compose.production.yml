name: leadgen-demo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    container_name: leadgen-web
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-/opt/leadgen/runtime.env}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE is required}
    container_name: leadgen-worker
    restart: unless-stopped
    init: true
    ipc: host
    env_file:
      - ${RUNTIME_ENV_FILE:-/opt/leadgen/runtime.env}
    environment:
      NODE_ENV: production
      PLAYWRIGHT_HEADLESS: "true"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_HEARTBEAT_PATH: /tmp/leadgen-worker-heartbeat
    security_opt:
      - seccomp=${SECCOMP_PATH:-/opt/leadgen/seccomp.json}
    shm_size: "1gb"
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('fs');const p=process.env.WORKER_HEARTBEAT_PATH||'/tmp/leadgen-worker-heartbeat';const age=Date.now()-Number(fs.readFileSync(p,'utf8'));process.exit(Number.isFinite(age)&&age<60000?0:1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  migrate:
    profiles: ["migrate"]
    image: ${WORKER_IMAGE:?WORKER_IMAGE is required}
    container_name: leadgen-migrate
    env_file:
      - ${RUNTIME_ENV_FILE:-/opt/leadgen/runtime.env}
    environment:
      NODE_ENV: production
      DRIZZLE_MIGRATIONS_FOLDER: /app/drizzle
    command: ["node", "dist/worker/migrate.js"]
    restart: "no"
    logging: *default-logging
